name: Schedule tests

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    if: ${{ false }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15-dev'
    name: Windows, SQLite, Python ${{ matrix.python-version }}
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3.txt'
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3.txt -e .
      - name: Run tests
        run: python -Wall tests/runtests.py -v2

  pyc-only:
    runs-on: monkci-ubuntu-24.04-4
    name: Byte-compiled Django with no source files (only .pyc files)
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Force Python 3.14 as default
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 $(which python3.14) 1
          sudo update-alternatives --set python3 $(which python3.14)
          python3 --version
      - name: Install libmemcached-dev for pylibmc
        run: |
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install .
      - name: Prepare site-packages
        run: |
          DJANGO_PACKAGE_ROOT=$(python -c 'import django; import os; print(os.path.dirname(django.__file__))')
          echo "Django found at: $DJANGO_PACKAGE_ROOT"
          python -m compileall -b $DJANGO_PACKAGE_ROOT
          find $DJANGO_PACKAGE_ROOT -name '*.py' -print -delete
      - run: python -m pip install -r tests/requirements/py3.txt
      - name: Run tests
        continue-on-error: true
        run: python -Wall tests/runtests.py --verbosity=2

  javascript-tests:
    runs-on: monkci-ubuntu-24.04-4
    name: JavaScript tests
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package.json'
      - run: npm install
      - run: npm test

  selenium-sqlite:
    runs-on: monkci-ubuntu-24.04-4
    name: Selenium tests, SQLite
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3.txt'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev google-chrome-stable
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3.txt -e .
      - name: Run Selenium tests
        working-directory: ./tests/
        run: |
          python -Wall runtests.py --verbosity 2 --noinput --selenium=chrome --headless --settings=test_sqlite --parallel 1

  selenium-postgresql:
    runs-on: monkci-ubuntu-24.04-4
    name: Selenium tests, PostgreSQL
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB=django \
            -e POSTGRES_USER=user \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:15-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U user && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3.txt'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev google-chrome-stable
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3.txt -r tests/requirements/postgres.txt -e .
      - name: Create PostgreSQL settings file
        run: mv ./.github/workflows/data/test_postgres.py.tpl ./tests/test_postgres.py
      - name: Run Selenium tests
        working-directory: ./tests/
        run: |
          python -Wall runtests.py --verbosity 2 --noinput --selenium=chrome --headless --settings=test_postgres --parallel 1
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f postgres || true

  postgresql:
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17, 18]
        server_side_bindings: [0, 1]
    runs-on: monkci-ubuntu-24.04-4
    name: PostgreSQL Versions
    timeout-minutes: 60
    continue-on-error: true
    env:
      SERVER_SIDE_BINDING: ${{ matrix.server_side_bindings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB=django \
            -e POSTGRES_USER=user \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:${{ matrix.version }}-alpine
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U user && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3.txt'
      - name: Force Python 3.14 as default
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 $(which python3.14) 1
          sudo update-alternatives --set python3 $(which python3.14)
          python3 --version
      - name: Install libmemcached-dev for pylibmc
        run: |
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3.txt -r tests/requirements/postgres.txt -e .
      - name: Create PostgreSQL settings file
        run: mv ./.github/workflows/data/test_postgres.py.tpl ./tests/test_postgres.py
      - name: Run tests
        working-directory: ./tests/
        run: python -Wall runtests.py --settings=test_postgres --verbosity=2
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f postgres || true
